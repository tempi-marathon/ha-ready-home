adjust_quantity:
  name: Adjust quantity
  description: Add or subtract from an item's quantity (e.g. -1 after using a can).
  fields:
    config_entry_id:
      name: Config entry
      description: Ready Home profile (optional while only one profile exists)
      selector:
        config_entry:
          integration: ready_home
    item_id:
      name: Item ID
      selector:
        text:
    name:
      name: Name
      selector:
        text:
    delta:
      name: Delta
      required: true
      example: -1
      selector:
        number:
          step: 0.01
          mode: box

remove_item:
  name: Remove inventory item
  description: Delete an item from the inventory.
  fields:
    config_entry_id:
      name: Config entry
      description: Ready Home profile (optional while only one profile exists)
      selector:
        config_entry:
          integration: ready_home
    item_id:
      name: Item ID
      selector:
        text:
    name:
      name: Name
      selector:
        text:

list_items:
  name: List inventory items
  description: Return inventory items, optionally filtered.
  fields:
    config_entry_id:
      name: Config entry
      description: Ready Home profile (optional while only one profile exists)
      selector:
        config_entry:
          integration: ready_home
    location:
      name: Location
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    readiness:
      name: Readiness
      description: Filter by category mapping (food, water, or neither)
      selector:
        select:
          options:
            - food
            - water
            - none
    status:
      name: Status
      selector:
        select:
          options:
            - expired
            - expiring
            - low_stock
            - ok

lookup_barcode:
  name: Look up barcode
  description: Look up a product on Open Food Facts (does not add to inventory).
  fields:
    config_entry_id:
      name: Config entry
      description: Ready Home profile (optional while only one profile exists)
      selector:
        config_entry:
          integration: ready_home
    barcode:
      name: Barcode
      required: true
      example: "3017620422003"
      selector:
        text:
