add_item:
  name: Add inventory item
  description: Add a new item to the Ready Home inventory.
  fields:
    config_entry_id:
      name: Config entry
      description: Ready Home profile (optional while only one profile exists)
      selector:
        config_entry:
          integration: ready_home
    name:
      name: Name
      description: Display name of the item
      required: true
      example: Bottled water
      selector:
        text:
    quantity:
      name: Quantity
      required: true
      example: 6
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    desired_quantity:
      name: Desired quantity
      example: 12
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    unit:
      name: Unit
      description: Stock count unit — how many bottles, packs, or boxes you have (not package size)
      default: piece
      selector:
        select:
          options:
            - box
            - pack
            - piece
    location:
      name: Location
      selector:
        text:
    category:
      name: Category
      description: Category label; food/water mapping is set in integration options
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:
    barcode:
      name: Barcode
      selector:
        text:
    priority:
      name: Priority
      default: important
      selector:
        select:
          options:
            - essential
            - important
            - optional
    expiry_date:
      name: Expiry date
      selector:
        date:
    contents_per_unit:
      name: Contents per unit
      description: Package size — how much is in one stock unit (one bottle, can, or pack)
      example: 0.5
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    contents_unit:
      name: Contents unit
      description: Unit for package size (liter, milliliter, gram, or kilogram)
      selector:
        select:
          options:
            - gram
            - kilogram
            - liter
            - milliliter
    calories_per_content:
      name: Calories per contents unit
      description: kcal per 1 contents unit (e.g. per gram or per milliliter)
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    liters_per_unit:
      name: Liters per unit
      description: Prefer contents_per_unit with a volume contents_unit instead
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    calories_per_unit:
      name: Calories per unit
      description: Prefer contents_per_unit and calories_per_content instead
      selector:
        number:
          min: 0
          step: 1
          mode: box

