add_item:
  name: Add inventory item
  description: Add a new item to the Ready Home inventory.
  fields:
    config_entry_id:
      name: Config entry
      description: Ready Home profile (optional while only one profile exists)
      selector:
        config_entry:
          integration: ready_home
    name:
      name: Name
      description: Display name of the item
      required: true
      example: Bottled water
      selector:
        text:
    quantity:
      name: Quantity
      required: true
      example: 6
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    desired_quantity:
      name: Desired quantity
      example: 12
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    unit:
      name: Unit
      default: piece
      selector:
        select:
          options:
            - piece
            - pack
            - box
            - gram
            - kilogram
            - liter
            - milliliter
    location:
      name: Location
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:
    barcode:
      name: Barcode
      selector:
        text:
    priority:
      name: Priority
      default: important
      selector:
        select:
          options:
            - essential
            - important
            - optional
    expiry_date:
      name: Expiry date
      selector:
        date:
    resource:
      name: Resource type
      default: none
      description: Whether this item counts toward water or food readiness
      selector:
        select:
          options:
            - none
            - water
            - food
    liters_per_unit:
      name: Liters per unit
      description: Required for water items when unit is not liter/milliliter
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    calories_per_unit:
      name: Calories per unit
      description: Required for food items
      selector:
        number:
          min: 0
          step: 1
          mode: box

