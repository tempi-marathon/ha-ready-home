name: Release

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.15)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            REF="main"
          else
            TAG="${{ github.event.release.tag_name }}"
            REF="${{ github.event.release.target_commitish }}"
            if [ -z "$REF" ]; then
              REF="main"
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION} ref=${REF}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Stamp manifest version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/ready_home/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"Stamped version={data['version']}")
          PY

      - name: Build ready_home.zip
        run: |
          set -euo pipefail
          rm -f ready_home.zip
          (
            cd custom_components/ready_home
            zip -r ../../ready_home.zip . -x "*__pycache__*" -x "*.pyc"
          )
          unzip -l ready_home.zip | head -n 40

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" ready_home.zip --clobber

      # Publish only from workflow_dispatch. Publishing fires release:published,
      # which re-runs this workflow to attach/replace the zip if needed — that
      # follow-up must not publish again (would be a no-op loop).
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "Published ${TAG}"
